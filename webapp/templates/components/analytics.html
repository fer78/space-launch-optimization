{% extends "base.html" %}

{% block title %}
    Analytics | Space Launch Optimization
{% endblock %}

{% block content %}

<section class="page-header">
    <div class="container">
        <h1 class="page-title">Interactive Analytics</h1>
        <p class="page-subtitle">
            Explore the main findings through interactive Plotly visualizations.
        </p>
    </div>
</section>

<section class="section">
    <div class="container">

        <!-- Chart Selector Form -->
        <form method="GET" class="chart-form">

            <label for="chart" class="form-label">
                Select a Visualization
            </label>

            <select
                name="chart"
                id="chart"
                class="form-select"
                onchange="this.form.submit()"
            >
                {% for option in chart_options %}
                    <option
                        value="{{ option.value }}"
                        {% if option.value == selected_chart %}selected{% endif %}
                    >
                        {{ option.label }}
                    </option>
                {% endfor %}
            </select>

        </form>

        <!-- Chart Container -->
        <div class="chart-card">
            {{ chart_html | safe }}
        </div>

    </div>
</section>

{% endblock %}
